  <h3>Input (Paste JS, C, or Python):</h3>
  <textarea id="input">def binary_search_position(arr, val, start, end):
    """Finds the correct index to insert 'val' in the sorted portion of arr."""
    while start <= end:
        mid = (start + end) // 2
        if arr[mid] == val:
            return mid + 1
        elif arr[mid] < val:
            start = mid + 1
        else:
            end = mid - 1
    return start</textarea>
